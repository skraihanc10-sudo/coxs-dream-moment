<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | Cox's Dream Moment</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../images/favicon.png" type="image/png">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<div id="login-screen" class="login-screen">
  <form id="login-form" class="login-box">
    <div class="login-brand">
      <img class="login-logo" src="../images/logo.png" alt="Cox's Dream Moment"
           onerror="this.hidden=true;this.nextElementSibling.hidden=false;">
      <span class="login-brand-fallback" hidden>
        <span class="brand-mark">CDM</span>
        <span>
          <span class="login-title">Cox's Dream Moment</span>
          <span class="login-sub">Admin panel</span>
        </span>
      </span>
    </div>
    <p class="login-sub login-sub-standalone">Admin panel</p>
    <label>Password</label>
    <input type="password" id="login-password" autocomplete="current-password" required>
    <button type="submit">Log in</button>
    <p id="login-error" class="error-text" hidden></p>
  </form>
</div>

<div id="dashboard" class="dashboard" hidden>
  <header class="admin-header">
    <div class="admin-header-brand">
      <img class="admin-logo" src="../images/logo-mark.png" alt="Cox's Dream Moment"
           onerror="this.hidden=true;this.nextElementSibling.hidden=false;">
      <span class="brand-mark" hidden>CDM</span>
      <span>Admin</span>
    </div>
    <div class="admin-header-actions">
      <a href="../shop.html" target="_blank" rel="noopener" class="btn-ghost-sm">View site ↗</a>
      <button id="logout-btn" class="btn-ghost-sm">Log out</button>
    </div>
  </header>

  <nav class="admin-tabs">
    <button class="admin-tab active" data-tab="packages">Packages</button>
    <button class="admin-tab" data-tab="settings">Site settings</button>
    <button class="admin-tab" data-tab="gallery">Gallery</button>
  </nav>

  <main class="admin-main">
    <div id="toast" class="toast" hidden></div>

    <!-- ===================== PACKAGES TAB ===================== -->
    <section id="tab-packages" class="admin-panel">
      <div class="panel-head">
        <h2>Packages</h2>
        <div>
          <button id="add-package-btn" class="btn-primary-sm">+ New package</button>
          <button id="save-packages-btn" class="btn-primary-sm">Save</button>
        </div>
      </div>
      <div id="packages-list"></div>
    </section>

    <!-- ===================== SETTINGS TAB ===================== -->
    <section id="tab-settings" class="admin-panel" hidden>
      <div class="panel-head">
        <h2>Site settings</h2>
        <button id="save-settings-btn" class="btn-primary-sm">Save</button>
      </div>
      <div id="settings-form" class="form-grid"></div>
    </section>

    <!-- ===================== GALLERY TAB ===================== -->
    <section id="tab-gallery" class="admin-panel" hidden>
      <div class="panel-head">
        <h2>Gallery</h2>
        <div>
          <button id="add-gallery-btn" class="btn-primary-sm">+ New image</button>
          <button id="save-gallery-btn" class="btn-primary-sm">Save</button>
        </div>
      </div>
      <div id="gallery-list"></div>
    </section>
  </main>
</div>

<template id="tpl-image-field">
  <div class="image-field">
    <img class="image-preview" src="" alt="">
    <div class="image-field-actions">
      <input type="file" accept="image/*" class="image-input" hidden>
      <button type="button" class="btn-ghost-sm image-upload-btn">Change image</button>
      <span class="image-path"></span>
    </div>
  </div>
</template>

<script src="admin.js"></script>
</body>
</html>
