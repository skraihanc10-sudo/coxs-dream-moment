<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | Cox's Dream Moment</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<div id="login-screen" class="login-screen">
  <form id="login-form" class="login-box">
    <div class="login-brand">
      <div class="brand-mark">CDM</div>
      <div>
        <div class="login-title">Cox's Dream Moment</div>
        <div class="login-sub">Admin প্যানেল</div>
      </div>
    </div>
    <label>পাসওয়ার্ড</label>
    <input type="password" id="login-password" autocomplete="current-password" required>
    <button type="submit">লগইন করুন</button>
    <p id="login-error" class="error-text" hidden></p>
  </form>
</div>

<div id="dashboard" class="dashboard" hidden>
  <header class="admin-header">
    <div class="admin-header-brand">
      <div class="brand-mark">CDM</div>
      <span>Cox's Dream Moment — Admin</span>
    </div>
    <div class="admin-header-actions">
      <a href="../shop.html" target="_blank" rel="noopener" class="btn-ghost-sm">সাইট দেখুন ↗</a>
      <button id="logout-btn" class="btn-ghost-sm">লগআউট</button>
    </div>
  </header>

  <nav class="admin-tabs">
    <button class="admin-tab active" data-tab="packages">প্যাকেজসমূহ</button>
    <button class="admin-tab" data-tab="settings">সাইট সেটিংস</button>
    <button class="admin-tab" data-tab="gallery">গ্যালারি</button>
  </nav>

  <main class="admin-main">
    <div id="toast" class="toast" hidden></div>

    <!-- ===================== PACKAGES TAB ===================== -->
    <section id="tab-packages" class="admin-panel">
      <div class="panel-head">
        <h2>প্যাকেজসমূহ</h2>
        <div>
          <button id="add-package-btn" class="btn-primary-sm">+ নতুন প্যাকেজ</button>
          <button id="save-packages-btn" class="btn-primary-sm">সেভ করুন</button>
        </div>
      </div>
      <div id="packages-list"></div>
    </section>

    <!-- ===================== SETTINGS TAB ===================== -->
    <section id="tab-settings" class="admin-panel" hidden>
      <div class="panel-head">
        <h2>সাইট সেটিংস</h2>
        <button id="save-settings-btn" class="btn-primary-sm">সেভ করুন</button>
      </div>
      <div id="settings-form" class="form-grid"></div>
    </section>

    <!-- ===================== GALLERY TAB ===================== -->
    <section id="tab-gallery" class="admin-panel" hidden>
      <div class="panel-head">
        <h2>গ্যালারি</h2>
        <div>
          <button id="add-gallery-btn" class="btn-primary-sm">+ নতুন ছবি</button>
          <button id="save-gallery-btn" class="btn-primary-sm">সেভ করুন</button>
        </div>
      </div>
      <div id="gallery-list"></div>
    </section>
  </main>
</div>

<template id="tpl-image-field">
  <div class="image-field">
    <img class="image-preview" src="" alt="">
    <div class="image-field-actions">
      <input type="file" accept="image/*" class="image-input" hidden>
      <button type="button" class="btn-ghost-sm image-upload-btn">ছবি বদলান</button>
      <span class="image-path"></span>
    </div>
  </div>
</template>

<script src="admin.js"></script>
</body>
</html>
