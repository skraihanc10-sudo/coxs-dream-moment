<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Cox's Dream Moment — Control Room</title>
<link rel="icon" href="/images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dream Moment">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>

<!-- ============================ login ============================ -->
<div id="login" class="login" hidden>
  <form class="login-card" id="login-form">
    <img src="/images/logo.png" alt="" class="login-logo">
    <h1>Control Room</h1>
    <p class="login-sub">Cox's Dream Moment</p>
    <div id="email-row" hidden>
      <label for="email">Email or mobile number</label>
      <input id="email" type="text" autocomplete="username" inputmode="email"
             placeholder="you@example.com or 01XXXXXXXXX">
    </div>
    <label for="password" id="password-label">Admin password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button type="submit" id="login-btn">Sign in</button>
    <button type="button" class="login-switch" id="login-switch">I am a team member</button>
    <p class="login-error" id="login-error" hidden></p>
  </form>
</div>

<!-- ============================ app ============================ -->
<div id="app" class="app" hidden>

  <aside class="side">
    <div class="side-brand">
      <img src="/images/logo.png" alt="">
      <div>
        <strong>Control Room</strong>
        <span id="who">Cox's Dream Moment</span>
      </div>
    </div>

    <nav class="side-nav">
      <button class="nav-item is-active" data-view="dashboard">
        <svg viewBox="0 0 24 24"><path d="M3 12l9-8 9 8v8a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg>
        Dashboard
      </button>
      <button class="nav-item" data-view="bookings" data-perm="bookings_view">
        <svg viewBox="0 0 24 24"><path d="M7 3v3M17 3v3M4 9h16M5 5h14a1 1 0 011 1v14a1 1 0 01-1 1H5a1 1 0 01-1-1V6a1 1 0 011-1z"/></svg>
        Bookings
        <span class="nav-badge" id="nav-new" hidden></span>
      </button>
      <button class="nav-item" data-view="accounts">
        <svg viewBox="0 0 24 24"><path d="M3 7h18v12H3zM3 11h18M7 15h4"/></svg>
        Accounts
      </button>
      <button class="nav-item" data-view="messages" data-perm="chat">
        <svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.4 8.4 0 01-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.4 8.4 0 013.8-.9h.5a8.5 8.5 0 018 8v.5z"/></svg>
        Messages
        <span class="nav-badge" id="nav-chat" hidden></span>
      </button>
      <button class="nav-item" data-view="team-chat" data-perm="team_chat">
        <svg viewBox="0 0 24 24"><path d="M17 8h2a2 2 0 012 2v9l-3-3h-7a2 2 0 01-2-2v-1"/><path d="M14 3H5a2 2 0 00-2 2v7l3-3h8a2 2 0 002-2V5a2 2 0 00-2-2z"/></svg>
        Team chat
        <span class="nav-badge" id="nav-team" hidden></span>
      </button>
      <button class="nav-item" data-view="approvals" data-owner>
        <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
        Approvals
        <span class="nav-badge" id="nav-approve" hidden></span>
      </button>
      <button class="nav-item" data-view="customers" data-owner>
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2M12 3a4 4 0 100 8 4 4 0 000-8z"/></svg>
        Customers
        <span class="nav-badge" id="nav-waiting" hidden></span>
      </button>
      <button class="nav-item" data-view="team" data-owner>
        <svg viewBox="0 0 24 24"><path d="M16 20v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2M9 7a3 3 0 100 6 3 3 0 000-6zM22 20v-2a4 4 0 00-3-3.87M16 4.13a4 4 0 010 7.75"/></svg>
        Team
      </button>
      <button class="nav-item" data-view="bin" data-main-admin>
        <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>
        Recycle bin
        <span class="nav-badge" id="nav-bin" hidden></span>
      </button>
      <button class="nav-item" data-view="content" data-owner>
        <svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM4 9h16M9 9v11"/></svg>
        Website content
      </button>
    </nav>

    <div class="side-foot">
      <button id="push-toggle" class="side-link" hidden></button>
      <a href="/" target="_blank" rel="noopener" class="side-link">View site &#8599;</a>
      <button id="logout" class="side-link">Sign out</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="menu-btn" id="menu-btn" aria-label="Menu">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <h1 id="view-title">Dashboard</h1>
      <div class="topbar-actions" id="topbar-actions"></div>
    </header>

    <div class="views">
      <section class="view is-active" id="view-dashboard"></section>
      <section class="view" id="view-bookings"></section>
      <section class="view" id="view-accounts"></section>
      <section class="view" id="view-messages"></section>
      <section class="view" id="view-team-chat"></section>
      <section class="view" id="view-approvals"></section>
      <section class="view" id="view-customers"></section>
      <section class="view" id="view-team"></section>
      <section class="view" id="view-bin"></section>
      <section class="view" id="view-content"></section>
    </div>
  </main>

  <div class="scrim" id="scrim" hidden></div>
</div>

<div class="toast-wrap" id="toasts"></div>

<!-- A single dialog element, reused by every screen. -->
<dialog id="sheet" class="sheet">
  <form method="dialog" class="sheet-inner" id="sheet-inner"></form>
</dialog>

<script src="/admin/content.js"></script>
<script src="/admin/app.js"></script>
<script src="/pwa.js" defer></script>
</body>
</html>
