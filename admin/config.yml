backend:
  name: git-gateway
  branch: main

# Netlify Identity + Git Gateway handle login and commits for you -
# no GitHub account needed for whoever edits content here.
local_backend: false

media_folder: "images"
public_folder: "/images"

site_url: "/"
display_url: "/"

collections:
  - name: "settings"
    label: "সাইট সেটিংস"
    files:
      - name: "settings"
        label: "যোগাযোগ, হিরো ও সাধারণ তথ্য"
        file: "content/settings.json"
        fields:
          - { label: "টপবারের ঘোষণা", name: "topbar_announcement", widget: "string" }
          - { label: "ফোন নম্বর (দেখানোর জন্য, যেমনঃ +৮৮০ ১৮৮৯-৫৩০৪২১)", name: "phone_display", widget: "string" }
          - { label: "WhatsApp নম্বর (শুধু সংখ্যা, দেশের কোডসহ, যেমনঃ 8801889530421)", name: "whatsapp_number", widget: "string" }
          - { label: "ইমেইল", name: "email", widget: "string" }
          - { label: "Facebook পেজ লিংক", name: "facebook_url", widget: "string" }
          - { label: "Facebook লেবেল টেক্সট", name: "facebook_label", widget: "string" }
          - { label: "সার্ভিস এরিয়া টেক্সট", name: "service_area", widget: "string" }
          - { label: "ঠিকানা", name: "address", widget: "string" }
          - label: "কার্যক্রমের সময়"
            name: "hours"
            widget: "list"
            fields:
              - { label: "দিন", name: "days", widget: "string" }
              - { label: "সময়", name: "time", widget: "string" }
          - { label: "সময়ের নিচে ছোট নোট", name: "hours_note", widget: "string" }
          - { label: "ফুটারের বিবরণ", name: "footer_desc", widget: "text" }
          - label: "হোমপেজ হিরো সেকশন"
            name: "hero"
            widget: "object"
            fields:
              - { label: "উপরের ছোট লাইন", name: "eyebrow", widget: "string" }
              - { label: "হেডলাইন (দুই লাইন করতে <br> লিখুন)", name: "heading", widget: "string" }
              - { label: "সাবহেডলাইন", name: "subheading", widget: "text" }
              - { label: "বাটনের লেখা", name: "cta_text", widget: "string" }
              - { label: "হিরো ছবি", name: "image", widget: "image" }

  - name: "packages"
    label: "প্যাকেজসমূহ"
    files:
      - name: "packages"
        label: "সব প্যাকেজ (দাম, ছবি, বিবরণ)"
        file: "content/packages.json"
        fields:
          - label: "প্যাকেজ লিস্ট"
            name: "packages"
            widget: "list"
            summary: "{{fields.name}} — {{fields.price}}"
            fields:
              - { label: "Slug (পরিবর্তন করবেন না)", name: "slug", widget: "string", hint: "এই আইডি বদলাবেন না, পেজের সাথে যুক্ত" }
              - { label: "পেজ ফাইলের নাম (পরিবর্তন করবেন না)", name: "file", widget: "string", hint: "উদাহরণঃ product-simple.html" }
              - { label: "প্যাকেজের নাম", name: "name", widget: "string" }
              - { label: "ব্যাজ (যেমনঃ বেসিক / জনপ্রিয়)", name: "badge", widget: "string" }
              - { label: "ট্রাস্ট লাইনের টেক্সট", name: "trust_extra", widget: "string" }
              - { label: "দাম", name: "price", widget: "string" }
              - { label: "আগের দাম (কাটা দাম হিসেবে দেখাবে)", name: "old_price", widget: "string" }
              - { label: "ছাড়ের লেবেল (যেমনঃ ৫০% ছাড়)", name: "discount", widget: "string" }
              - label: "ক্যাটাগরি"
                name: "categories"
                widget: "select"
                multiple: true
                options: ["proposal", "dinner"]
              - { label: "প্রধান ছবি", name: "main_image", widget: "image" }
              - label: "থাম্বনেইল ছবি (৪টি)"
                name: "thumbnails"
                widget: "list"
                fields:
                  - { label: "ছবি", name: "image", widget: "image" }
                  - { label: "Alt টেক্সট", name: "alt", widget: "string" }
              - label: "প্যাকেজে যা থাকছে"
                name: "inclusions"
                widget: "list"
              - { label: "বিবরণ (বিবরণ ট্যাব)", name: "description", widget: "text" }
              - { label: "বুকিং নীতি (বুকিং নীতি ট্যাব)", name: "booking_policy", widget: "text" }
              - { label: "FAQ (FAQ ট্যাব)", name: "faq", widget: "text" }

  - name: "gallery"
    label: "গ্যালারি"
    files:
      - name: "gallery"
        label: "গ্যালারির ছবি"
        file: "content/gallery.json"
        fields:
          - label: "ছবির লিস্ট"
            name: "items"
            widget: "list"
            summary: "{{fields.caption}}"
            fields:
              - { label: "ছবি", name: "image", widget: "image" }
              - { label: "Alt টেক্সট", name: "alt", widget: "string" }
              - { label: "ক্যাপশন", name: "caption", widget: "string" }
              - label: "সাইজ"
                name: "size"
                widget: "select"
                required: false
                options:
                  - { label: "নরমাল", value: "" }
                  - { label: "লম্বা (Tall)", value: "tall" }
                  - { label: "চওড়া (Wide)", value: "wide" }
          - { label: "নিচের নোট টেক্সট", name: "note", widget: "string" }
